{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{request.user.first_name}}'s DMs</title>
  <link rel="icon" href="{% static 'images/Vibe.png' %}" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex">

  <!-- Sidebar -->
  <aside class="w-72 bg-white border-r hidden md:flex flex-col">
    <!-- Header -->
    <div class="p-4 border-b flex items-center justify-between">
      <h1 class="text-xl font-bold">Chats</h1>
      <button class="p-2 rounded-full hover:bg-gray-100">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M12 4v16m8-8H4"/>
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="p-3">
      <input type="text" placeholder="Search chats" 
             class="w-full rounded-lg border-gray-300 focus:ring-2 focus:ring-blue-500 px-3 py-2 text-sm">
    </div>

    <!-- Conversations List -->
    <div class="flex-1 overflow-y-auto">
      <ul class="divide-y">
        <li class="p-4 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
          <img src="https://i.pravatar.cc/40" alt="user" class="w-10 h-10 rounded-full">
          <div class="flex-1">
            <p class="font-semibold">Alex Johnson</p>
            <p class="text-sm text-gray-500 truncate">Typing...</p>
          </div>
          <span class="text-xs text-gray-400">2m</span>
        </li>
        <li class="p-4 hover:bg-gray-50 cursor-pointer flex items-center gap-3">
          <img src="https://i.pravatar.cc/41" alt="user" class="w-10 h-10 rounded-full">
          <div class="flex-1">
            <p class="font-semibold">Sophia Lee</p>
            <p class="text-sm text-gray-500 truncate">See you tomorrow!</p>
          </div>
          <span class="text-xs text-gray-400">10m</span>
        </li>
        <!-- Loop through chats here in Django -->
      </ul>
    </div>
  </aside>

  <!-- Chat Section -->
  <section class="flex-1 flex flex-col">

    <!-- Chat Header -->
    <div class="p-4 border-b bg-white flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <img src="https://i.pravatar.cc/50" alt="user" class="w-10 h-10 rounded-full">
        <div>
          <p class="font-semibold">Alex Johnson</p>
          <p class="text-xs text-gray-500">Online</p>
        </div>
      </div>
      <button class="p-2 rounded-full hover:bg-gray-100">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M15 10l4.553-4.553a1.5 1.5 0 012.121 2.121L17.121 12l4.553 4.553a1.5 1.5 0 01-2.121 2.121L15 14m-6 0l-4.553 4.553a1.5 1.5 0 01-2.121-2.121L6.879 12l-4.553-4.553a1.5 1.5 0 012.121-2.121L9 10"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
      <!-- Sender -->
      <div class="flex gap-3">
        <img src="https://i.pravatar.cc/40" class="w-8 h-8 rounded-full" alt="">
        <div class="bg-white px-4 py-2 rounded-2xl shadow-sm max-w-xs">
          <p>Hey! How’s it going?</p>
          <span class="text-xs text-gray-400 block mt-1">10:24 AM</span>
        </div>
      </div>
      <!-- Receiver -->
      <div class="flex gap-3 justify-end">
        <div class="bg-blue-500 text-white px-4 py-2 rounded-2xl shadow-sm max-w-xs">
          <p>All good! Just working on my project 🚀</p>
          <span class="text-xs text-gray-200 block mt-1">10:26 AM</span>
        </div>
      </div>
      <!-- More messages loop in Django -->
    </div>

    <!-- Message Input -->
    <div class="p-4 border-t bg-white flex items-center gap-3">
      <button class="p-2 rounded-full hover:bg-gray-100">
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828L18 9.828V7h-2.828z"/>
        </svg>
      </button>
      <input type="text" placeholder="Type a message..." 
             class="flex-1 rounded-full border-gray-300 focus:ring-2 focus:ring-blue-500 px-4 py-2 text-sm">
      <button class="p-2 rounded-full bg-blue-500 text-white hover:bg-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 13l4 4L19 7"/>
        </svg>
      </button>
    </div>

  </section>
</body>
</html>
