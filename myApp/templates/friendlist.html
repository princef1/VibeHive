<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2 class="text-2xl font-bold mb-4">
        {% if user_obj %}
        {{ user_obj.full_name }}'s Friends ({{ friends|length }})
    {% else %}
        Your Friends ({{ friends|length }})
    {% endif %}
    </h2>

    {% if friends %}
    <ul class="space-y-2">
        {% for friend in friends %}
        <li>
            <a href="{% url 'profile' friend.user_name %}" class="text-blue-600 hover:underline">
                {{ friend.full_name }} (@{{ friend.user_name }})
            </a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>You have no friends yet.</p>

</body>

</html>
